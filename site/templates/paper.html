{% extends "base.html" %}
{% block title %}{{ t('meta.paper_title') }} · {{ brand }}{% endblock %}
{% block head %}<meta name="robots" content="noindex">{% endblock %}
{% block sound %}
<button type="button" class="icon-btn" id="soundBtn" aria-pressed="false" aria-label="{{ t('nav.sound_on') }}" data-label-on="{{ t('nav.sound_off') }}" data-label-off="{{ t('nav.sound_on') }}">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" opacity=".35"/></svg>
</button>
{% endblock %}
{% block main %}
<div class="flow-page">
  <div class="scene-fixed">
    <div class="scene-poster" aria-hidden="true"></div>
    <canvas id="gl" class="scene-canvas" aria-hidden="true"></canvas>
  </div>
  <div class="flow-wrap">
    <div class="result" id="view" aria-live="polite" data-map="{{ asset('data/map.js') }}">
      <p class="muted" id="loading">{{ t('paper.loading') }}</p>
    </div>
  </div>
</div>
{% endblock %}
{% block footer %}{% endblock %}
{% block scripts %}
<script src="{{ asset('vendor/three-r128.min.js') }}" defer></script>
<script src="{{ asset('vendor/gsap-3.12.5.min.js') }}" defer></script>
<script src="{{ asset('js/scene.js') }}" defer></script>
<script src="{{ asset('js/site.js') }}" defer></script>
<script src="{{ asset('js/mapcore.js') }}" defer></script>
<script src="{{ asset('js/paper.js') }}" defer></script>
{% endblock %}
