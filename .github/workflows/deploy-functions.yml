# Deploys every Supabase Edge Function in supabase/functions to the live project.
# Runs when function code changes on main, or by hand (Actions → Deploy functions → Run workflow).
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Deploy functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: maqcaowpfhmqcavboszy
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first."; exit 1
          fi
      - name: Deploy all functions
        # verify_jwt per function comes from supabase/config.toml (all false: each function checks its own input).
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
      - name: List deployed functions
        run: supabase functions list --project-ref "$PROJECT_REF"
